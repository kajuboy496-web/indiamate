<script>
const $=id=>document.getElementById(id);
const get=(key,def=[])=>{
 try{return JSON.parse(localStorage.getItem(key))||def}catch(e){return def}
};
const put=(key,value)=>localStorage.setItem(key,JSON.stringify(value));
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const box=$('screen');

function shell(title,html){
 box.innerHTML=`<button class="back" onclick="goHome()">← वापस</button><h2>${title}</h2>${html}`;
}
function goHome(){
 if(timerId){pauseTimer()}
 box.hidden=true;
 $('home').hidden=false;
 window.scrollTo(0,0);
}
function openPage(page){
 $('home').hidden=true;
 box.hidden=false;
 window.scrollTo(0,0);
 const pages={calc,notes,expense,tasks,timer,study,quiz,grammar,math,shayari,contact};
 pages[page]();
}
function backButton(){goHome()}

/* CALCULATOR */
let expr='';
function calc(){
/* MOBILE STYLE CALCULATOR */
let expr = '';
let calcJustSolved = false;

function calc(){
 shell('🧮 Calculator',`
 <div class="mobile-calc">
   <div class="calc-screen">
     <div id="calcHistory"></div>
     <div id="display">0</div>
   </div>

   <div class="calc-buttons">
     <button class="calc-action" onclick="calcClear()">AC</button>
     <button class="calc-action" onclick="calcDelete()">⌫</button>
     <button class="calc-action" onclick="calcKey('%')">%</button>
     <button class="calc-op" onclick="calcKey('÷')">÷</button>

     <button onclick="calcKey('7')">7</button>
     <button onclick="calcKey('8')">8</button>
     <button onclick="calcKey('9')">9</button>
     <button class="calc-op" onclick="calcKey('×')">×</button>

     <button onclick="calcKey('4')">4</button>
     <button onclick="calcKey('5')">5</button>
     <button onclick="calcKey('6')">6</button>
     <button class="calc-op" onclick="calcKey('−')">−</button>

     <button onclick="calcKey('1')">1</button>
     <button onclick="calcKey('2')">2</button>
     <button onclick="calcKey('3')">3</button>
     <button class="calc-op" onclick="calcKey('+')">+</button>

     <button onclick="calcKey('±')">+/−</button>
     <button onclick="calcKey('0')">0</button>
     <button onclick="calcKey('.')">.</button>
     <button class="calc-equal" onclick="calcKey('=')">=</button>
   </div>
 </div>
 `);
 $('display').textContent=expr||'0';
}

function calcKey(k){
 let operators=['+','−','×','÷'];

 if(k==='='){
   if(!expr)return;
   try{
     let v=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
     if(!/^[0-9+\-*/.%() ]+$/.test(v))throw Error();
     v=v.replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
     let result=Function('"use strict";return ('+v+')')();
     if(!Number.isFinite(result))throw Error();

     $('calcHistory').textContent=expr+' =';
     expr=String(Number(result.toFixed(10)));
     calcJustSolved=true;
   }catch(e){
     $('display').textContent='Error';
     expr='';
     return;
   }
 }else if(k==='AC'){
   calcClear();return;
 }else if(k==='⌫'){
   calcDelete();return;
 }else if(k==='±'){
   if(expr)expr=expr.startsWith('-')?expr.slice(1):'-'+expr;
 }else{
   if(calcJustSolved){
     if(operators.includes(k)){} 
     else expr='';
     calcJustSolved=false;
   }
   if(operators.includes(k)){
     if(!expr && k!=='−')return;
     if(operators.includes(expr.slice(-1)))expr=expr.slice(0,-1);
   }
   if(k==='.' && expr.split(/[+\-×÷]/).pop().includes('.'))return;
   expr+=k;
 }
 $('display').textContent=expr||'0';
}

function calcClear(){
 expr='';
 calcJustSolved=false;
 $('display').textContent='0';
 $('calcHistory').textContent='';
}

function calcDelete(){
 expr=expr.slice(0,-1);
 calcJustSolved=false;
 $('display').textContent=expr||'0';
  }
      
 shell('🧮 Calculator',`
 <div class="formula timer" id="display">0</div>
 <div class="grid">
 ${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'].map(x=>
 `<button onclick="calcKey('${x}')" style="font-size:23px">${x}</button>`).join('')}
 </div>
 <button class="red" onclick="calcClear()">AC</button>
 <button class="light" onclick="calcDelete()">⌫</button>`);
}
function calcKey(k){
 if(k==='='){
 try{
 let v=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
 if(!/^[0-9+\-*/.() ]+$/.test(v))throw Error();
 let result=Function('"use strict";return ('+v+')')();
 if(!Number.isFinite(result))throw Error();
 expr=String(Number(result.toFixed(8)));
 }catch(e){expr='';$('display').textContent='गलत गणना';return}
 }else expr+=k;
 $('display').textContent=expr||'0';
}
function calcClear(){expr='';$('display').textContent='0'}
function calcDelete(){expr=expr.slice(0,-1);$('display').textContent=expr||'0'}

/* NOTES */
let editingNote=null;
function notes(){
 editingNote=null;
 shell('📝 मेरे Notes',`
 <input id="noteTitle" placeholder="नोट का नाम">
 <textarea id="noteBody" placeholder="अपना नोट लिखें..."></textarea>
 <button onclick="saveNote()">💾 नोट सेव करें</button>
 <button class="light" onclick="clearNoteEditor()">नया नोट</button>
 <h3>मेरे सभी नोट</h3><div id="noteList"></div>`);
 drawNotes();
}
function clearNoteEditor(){
 editingNote=null;
 $('noteTitle').value='';
 $('noteBody').value='';
}
function saveNote(){
 let title=$('noteTitle').value.trim(),body=$('noteBody').value.trim();
 if(!title||!body)return alert('पहले नाम और नोट लिखें।');
 let a=get('notes');
 if(editingNote!==null){
 let n=a.find(x=>String(x.id)===String(editingNote));
 if(n){n.title=title;n.body=body}
 }else{
 a.push({id:Date.now(),title,body,date:new Date().toLocaleDateString('hi-IN')});
 }
 put('notes',a);clearNoteEditor();drawNotes();
}
function drawNotes(){
 let a=get('notes');
 $('noteList').innerHTML=a.length?a.slice().reverse().map(n=>`
 <div class="item">
 <h3>${safe(n.title)}</h3><p>${safe(n.body)}</p>
 <small class="muted">${safe(n.date||'')}</small><br>
 <button class="light" onclick="editNote('${n.id}')">✏️ Edit</button>
 <button class="red" onclick="deleteNote('${n.id}')">हटाएँ</button>
 </div>`).join(''):'<p class="muted">अभी कोई नोट नहीं है।</p>';
}
function editNote(id){
 let n=get('notes').find(x=>String(x.id)===String(id));if(!n)return;
 editingNote=id;$('noteTitle').value=n.title;$('noteBody').value=n.body;
 window.scrollTo(0,0);
}
function deleteNote(id){
 if(confirm('क्या यह नोट हटाना है?')){
 put('notes',get('notes').filter(x=>String(x.id)!==String(id)));drawNotes();
 }
}

/* EXPENSE */
function expense(){
 shell('💰 खर्च का हिसाब',`
 <h3>आज का कुल खर्च</h3><div class="timer" id="totalExpense">₹0</div>
 <input id="expenseName" placeholder="खर्च का नाम">
 <input id="expenseAmount" type="number" min="0" step="0.01" placeholder="रकम ₹">
 <select id="expenseCategory">
 <option>अन्य</option><option>खाना</option><option>पढ़ाई</option><option>यात्रा</option><option>घर</option><option>मोबाइल</option>
 </select>
 <button onclick="addExpense()">+ खर्च जोड़ें</button>
 <button class="red" onclick="clearExpenses()">पूरा हिसाब साफ करें</button>
 <h3>खर्च की सूची</h3><div id="expenseList"></div>`);
 drawExpenses();
}
function drawExpenses(){
 let a=get('expenses');
 let total=a.reduce((s,x)=>s+(Number(x.amount)||0),0);
 $('totalExpense').textContent='₹'+total.toLocaleString('en-IN');
 $('expenseList').innerHTML=a.length?a.slice().reverse().map(x=>`
 <div class="item"><b>${safe(x.name)}</b><p>₹${Number(x.amount).toLocaleString('en-IN')} • ${safe(x.category)}</p>
 <button class="red" onclick="deleteExpense('${x.id}')">हटाएँ</button></div>`).join(''):'<p class="muted">अभी कोई खर्च नहीं है।</p>';
}
function addExpense(){
 let name=$('expenseName').value.trim(),amount=Number($('expenseAmount').value);
 if(!name||!Number.isFinite(amount)||amount<=0)return alert('नाम और सही रकम लिखें।');
 let a=get('expenses');a.push({id:Date.now(),name,amount,category:$('expenseCategory').value});
 put('expenses',a);$('expenseName').value='';$('expenseAmount').value='';drawExpenses();
}
function deleteExpense(id){put('expenses',get('expenses').filter(x=>String(x.id)!==String(id)));drawExpenses()}
function clearExpenses(){
 if(confirm('क्या पूरा खर्च का हिसाब हटाना है?')){put('expenses',[]);drawExpenses()}
}

/* TASKS */
function tasks(){
 shell('✅ कामों की लिस्ट',`
 <input id="taskInput" placeholder="नया काम लिखें">
 <button onclick="addTask()">काम जोड़ें</button>
 <div id="taskList"></div>`);
 drawTasks();
}
function drawTasks(){
 let a=get('tasks').map((t,i)=>({
 id:t.id??i,text:t.text??t.task??t.name??t.title??'पुराना काम',done:!!(t.done??t.completed)
 }));
 put('tasks',a);
 $('taskList').innerHTML=a.length?a.map(t=>`
 <div class="item">
 <label><input style="width:auto" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')">
 <span style="${t.done?'text-decoration:line-through':''}">${safe(t.text)}</span></label>
 <button class="red" onclick="deleteTask('${t.id}')">हटाएँ</button>
 </div>`).join(''):'<p class="muted">अभी कोई काम नहीं है।</p>';
}
function addTask(){
 let text=$('taskInput').value.trim();if(!text)return alert('काम लिखें।');
 let a=get('tasks');a.push({id:Date.now(),text,done:false});put('tasks',a);
 $('taskInput').value='';drawTasks();
}
function toggleTask(id){
 let a=get('tasks');let t=a.find(x=>String(x.id)===String(id));if(t)t.done=!t.done;
 put('tasks',a);drawTasks();
}
function deleteTask(id){put('tasks',get('tasks').filter(x=>String(x.id)!==String(id)));drawTasks()}

/* FOCUS TIMER */
let timerId=null,endAt=0,remaining=0;
function timer(){
 shell('⏱️ Focus Timer',`
 <p class="muted">पढ़ाई का समय चुनें। बीच में ऐप से बाहर जाने पर आवाज़ बजाने की कोशिश होगी।</p>
 <input id="mins" type="number" min="1" max="600" placeholder="कितने मिनट?">
 <div class="timer" id="clock">00:00</div>
 <p id="timerStatus" class="muted" style="text-align:center">तैयार हैं?</p>
 <button onclick="startTimer()">▶ शुरू करें</button>
 <button class="light" onclick="pauseTimer()">⏸ Pause</button>
 <button class="red" onclick="resetTimer()">↻ Reset</button>`);
}
function startTimer(){
 if(timerId)return;
 if(remaining<=0){
 let m=Number($('mins').value);
 if(!Number.isFinite(m)||m<1||m>600)return alert('1 से 600 मिनट के बीच समय लिखें।');
 remaining=m*60;
 }
 endAt=Date.now()+remaining*1000;
 $('timerStatus').textContent='पढ़ाई जारी रखें 📚';
 tick();timerId=setInterval(tick,500);
}
function tick(){
 remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));
 $('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
 if(remaining<=0){
 clearInterval(timerId);timerId=null;$('timerStatus').textContent='समय पूरा हुआ! 🎉';beep();
 }
}
function pauseTimer(){
 if(timerId){clearInterval(timerId);timerId=null;remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));$('timerStatus').textContent='Timer रुका हुआ है।'}
}
function resetTimer(){
 if(timerId)clearInterval(timerId);timerId=null;remaining=0;
 if($('clock'))$('clock').textContent='00:00';
 if($('timerStatus'))$('timerStatus').textContent='फिर से तैयार!';
}
function beep(){
 try{
 let c=new (window.AudioContext||window.webkitAudioContext)();
 let o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
 o.frequency.value=880;g.gain.value=.2;o.start();o.stop(c.currentTime+1);
 }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden&&timerId){beep()}
});

/* STUDY PLANNER */
function study(){
 shell('📚 Study Planner',`
 <input id="subject" placeholder="कौन-सा विषय?">
 <input id="duration" type="number" min="1" placeholder="कितने मिनट पढ़ना है?">
 <button onclick="addStudy()">प्लान बनाओ</button>
 <h3>मेरे प्लान</h3><div id="studyList"></div>`);
 drawStudy();
}
function addStudy(){
 let subject=$('subject').value.trim(),minutes=Number($('duration').value);
 if(!subject||!Number.isFinite(minutes)||minutes<1)return alert('विषय और सही मिनट लिखें।');
 let a=get('study');a.push({id:Date.now(),subject,minutes});put('study',a);
 $('subject').value='';$('duration').value='';drawStudy();
}
function drawStudy(){
 let a=get('study');
 $('studyList').innerHTML=a.length?a.map(x=>`
 <div class="item">${safe(x.subject)} — ${x.minutes} मिनट
 <button class="red" onclick="deleteStudy('${x.id}')">हटाएँ</button></div>`).join(''):'<p class="muted">अभी कोई प्लान नहीं है।</p>';
}
function deleteStudy(id){put('study',get('study').filter(x=>String(x.id)!==String(id)));drawStudy()}

/* QUIZ */
const questions=[
['भारत की राजधानी क्या है?',['दिल्ली','मुंबई','लखनऊ','जयपुर'],0,'भारत की राजधानी नई दिल्ली है।'],
['2 + 2 × 2 कितना होगा?',['8','6','4','10'],1,'पहले गुणा: 2×2=4, फिर 2 जोड़ें। उत्तर 6 है।'],
['पानी का रासायनिक सूत्र क्या है?',['CO2','O2','H2O','NaCl'],2,'पानी का सूत्र H₂O है।'],
['भारत का राष्ट्रीय पशु कौन है?',['शेर','बाघ','हाथी','घोड़ा'],1,'भारत का राष्ट्रीय पशु बाघ है।'],
['एक सप्ताह में कितने दिन होते हैं?',['5','6','7','8'],2,'एक सप्ताह में 7 दिन होते हैं।'],
['Apple कौन-सा शब्द है?',['Noun','Verb','Adjective','Adverb'],0,'Apple एक Noun यानी संज्ञा है।'],
['15 × 4 कितना होगा?',['45','50','60','65'],2,'15 गुणा 4 = 60।'],
['विलोम शब्द: दिन',['सुबह','रात','दोपहर','शाम'],1,'दिन का विलोम रात है।'],
['भारत का स्वतंत्रता दिवस कब है?',['15 अगस्त','26 जनवरी','2 अक्टूबर','14 नवंबर'],0,'15 अगस्त को स्वतंत्रता दिवस मनाया जाता है।'],
['5 का वर्ग कितना है?',['10','15','20','25'],3,'5 × 5 = 25।'],
['वह स्कूल जाता है। English?',['He go school','He goes to school','He going school','He gone school'],1,'He goes to school सही वाक्य है।'],
['100 में 25% कितना है?',['20','25','30','50'],1,'100 का 25 प्रतिशत = 25।']
];
let qSet=[],qIndex=0,qScore=0,qAnswered=false;
function quiz(){
 shell('🎯 Quiz',`
 <p>अपना स्तर चुनें और सवालों के जवाब दें।</p>
 <select id="quizLevel"><option value="easy">आसान Quiz</option><option value="hard">कठिन Quiz</option></select>
 <button onclick="startQuiz()">Quiz शुरू करें</button>
 <div id="quizBox"></div>`);
}
function startQuiz(){
 let level=$('quizLevel').value;
 qSet=questions.slice();
 if(level==='hard')qSet=qSet.slice().reverse();
 qSet=qSet.sort(()=>Math.random()-.5).slice(0,5);
 qIndex=0;qScore=0;qAnswered=false;drawQuestion();
}
function drawQuestion(){
 let q=qSet[qIndex];
 $('quizBox').innerHTML=`
 <p>सवाल ${qIndex+1} / ${qSet.length} • स्कोर ${qScore}</p>
 <h3>${safe(q[0])}</h3>
 ${q[1].map((v,i)=>`<button class="option" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${safe(v)}</button>`).join('')}
 <div id="feedback"></div>`;
 qAnswered=false;
}
function answerQuiz(i){
 if(qAnswered)return;qAnswered=true;
 let q=qSet[qIndex],correct=i===q[2];if(correct)qScore++;
 $('feedback').innerHTML=`<p>${correct?'✅ सही जवाब!':'❌ सही जवाब: '+safe(q[1][q[2]])}</p><p>${safe(q[3])}</p>
 <button onclick="nextQuestion()">${qIndex===qSet.length-1?'रिजल्ट देखें':'अगला सवाल'}</button>`;
}
function nextQuestion(){
 qIndex++;
 if(qIndex>=qSet.length){
 $('quizBox').innerHTML=`<h3>Quiz पूरा हुआ 🎉</h3><div class="timer">${qScore}/${qSet.length}</div>
 <p>${qScore>=4?'बहुत बढ़िया!':'अच्छी कोशिश! फिर अभ्यास करें।'}</p>
 <button onclick="startQuiz()">दूसरा Quiz खेलें</button>`;
 }else drawQuestion();
}

const tenses=[
['Simple Present','Subject + V1(s/es)','I play cricket.','मैं क्रिकेट खेलता हूँ।'],
['Present Continuous','Subject + is/am/are + V-ing','She is reading.','वह पढ़ रही है।'],
['Present Perfect','Subject + has/have + V3','They have finished work.','उन्होंने काम पूरा कर लिया है।'],
['Present Perfect Continuous','Subject + has/have been + V-ing + since/for','I have been studying for two hours.','मैं दो घंटे से पढ़ रहा हूँ।'],
['Simple Past','Subject + V2','He went home.','वह घर गया।'],
['Past Continuous','Subject + was/were + V-ing','They were playing.','वे खेल रहे थे।'],
['Past Perfect','Subject + had + V3','She had eaten.','उसने खा लिया था।'],
['Past Perfect Continuous','Subject + had been + V-ing + since/for','He had been waiting for an hour.','वह एक घंटे से इंतजार कर रहा था।'],
['Simple Future','Subject + will + V1','I will call you.','मैं तुम्हें फोन करूँगा।'],
['Future Continuous','Subject + will be + V-ing','I will be studying.','मैं पढ़ रहा होऊँगा।'],
['Future Perfect','Subject + will have + V3','She will have finished.','वह पूरा कर चुकी होगी।'],
['Future Perfect Continuous','Subject + will have been + V-ing + since/for','I will have been working for two hours.','मैं दो घंटे से काम कर रहा होऊँगा।']
];
function grammar(){
 shell('📖 English Grammar Teacher',`
 <p class="muted">आसान भाषा में Grammar सीखें। किसी पाठ पर सुनें दबाएँ।</p>
 <h3>Grammar के सभी मुख्य टॉपिक</h3><div id="grammarList"></div>
 <h3>12 Tenses</h3><div id="tenseList"></div>`);
 $('grammarList').innerHTML=lessons.map((x,i)=>`
 <div class="item"><b>${i+1}. ${safe(x[0])}</b><p>${safe(x[1])}</p>
 <div class="formula">Example: ${safe(x[2])}</div>
 <button class="light" onclick="speakGrammar(${i},false)">🔊 समझें</button>
 </div>`).join('');
 $('tenseList').innerHTML=tenses.map((x,i)=>`
 <div class="item"><b>${safe(x[0])}</b>
 <div class="formula">Formula: ${safe(x[1])}</div>
 <p>Example: ${safe(x[2])}</p><p>हिंदी: ${safe(x[3])}</p>
 <button class="light" onclick="speakGrammar(${i},true)">🔊 सुनें</button></div>`).join('');
}
function speakGrammar(i,isTense){
 if(!('speechSynthesis'in window))return alert('इस फोन में आवाज़ की सुविधा उपलब्ध नहीं है।');
 speechSynthesis.cancel();
 let x=isTense?tenses[i]:lessons[i];
 let u=new SpeechSynthesisUtterance(x.join('. '));
 u.lang='en-IN';u.rate=.85;speechSynthesis.speak(u);
}
